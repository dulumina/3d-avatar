<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Avatar - 3D Talking Avatar</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="container">
        <div id="avatar-container"></div>
        <div id="controls">
            <textarea id="text-input" placeholder="Ketik teks untuk avatar bicara..." rows="1">Halo! Aku adalah avatar 3D. Aku bisa bicara mengikuti teks yang kamu ketik.</textarea>
            <div id="voice-controls">
                <select id="voice-select" title="Pilih suara"></select>
                <div id="voice-status">Memuat suara...</div>
            </div>
            <div id="rate-control">
                <input type="range" id="rate-slider" min="0.5" max="2" step="0.1" value="1.0">
                <span id="rate-label">1.0x</span>
            </div>
            <button id="speak-btn">&#9654; Bicara</button>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
        }
    }
    </script>
    <script type="module" src="script.js?v=3"></script>
</body>
</html>
